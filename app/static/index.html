<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>星澜诊断 · 经营分析助手</title>
  <link rel="stylesheet" href="/static/app.css?v=19" />
</head>
<body>
  <header class="top">
    <div class="brand">经营分析助手</div>
    <label class="period">
      期间
      <select id="period" aria-label="期间"></select>
    </label>
    <button type="button" id="chat-open" class="chat-open" aria-controls="chat" aria-pressed="true" title="隐藏对话栏">AI问数</button>
  </header>
  <main class="shell">
    <section class="report" id="report" aria-live="polite">
      <p class="placeholder">正在计算上个月的销售回款率…</p>
    </section>
    <section class="chat" id="chat">
      <div class="chat-head">
        <strong>对话</strong>
        <span class="chat-head-right">
          追问会更新左侧报告
          <button type="button" id="chat-hide" class="chat-hide" title="隐藏对话栏">隐藏 ›</button>
        </span>
      </div>
      <div id="messages" class="messages"></div>
      <div id="chips" class="chips"></div>
      <form id="ask-form" class="ask">
        <input id="question" name="question" autocomplete="off" placeholder="追问探数，例如：华东主要是哪些代理商在拖累？" />
        <button type="submit">发送</button>
      </form>
    </section>
  </main>
  <button type="button" id="chat-show" class="chat-show" aria-controls="chat" hidden>展开对话 ‹</button>
  <div id="modal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <header>
        <h2 id="modal-title">数字从哪来</h2>
        <button type="button" id="modal-close">关闭</button>
      </header>
      <div id="modal-body"></div>
    </div>
  </div>
  <script src="/static/app.js?v=19"></script>
</body>
</html>
